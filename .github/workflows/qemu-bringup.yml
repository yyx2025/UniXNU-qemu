name: qemu-bringup

# Boot the QEMU virt board in QEMU on a macOS runner and check the result.
#
# Stage 1 (native-user): qemu_defconfig + --native-user. XNU's mockfs serves
#   UniXNU's static test process as /sbin/launchd on md0, so the run proves the
#   whole chain below the filesystem: EDK II firmware, DarwinBoot, kernel entry,
#   MMU, 4 KiB page tables, platform expert, IOKit, AMFI and a real EL0 process.
#   run-qemu.py prints "native user: PC ... EL0, getpid 1, ... hw.pagesize 4096".
#
# The job fails if that line is missing. Nothing here touches a device.

on:
  push:
    branches: [main]
    paths:
      - 'configs/**'
      - 'package/**'
      - 'scripts/**'
      - 'board.toml'
      - 'feeds.toml'
      - '.github/workflows/qemu-bringup.yml'
  workflow_dispatch:
    inputs:
      seconds:
        description: 'How long QEMU runs (native-user stops early on success)'
        required: false
        default: '420'

permissions:
  contents: read

concurrency:
  group: qemu-bringup-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  native-user:
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Checkout device repository (UniXNU-qemu)
        uses: actions/checkout@v4

      - name: Checkout UniXNU build system (with submodules)
        uses: actions/checkout@v4
        with:
          # Fork, not upstream: vermeer-fix carries -Wno-unknown-warning-option in
          # scripts/audit-storage-interface.py and the legacy-display guard in
          # patches/xnu/offline-component-load-probes.patch.
          repository: yyx2025/UniXNU
          ref: vermeer-fix
          submodules: recursive
          path: unixnu

      - name: Checkout Mu-Silicium for the panic screen font
        # scripts/patch-xnu-entry-probe.py --panic-screen compiles scripts/xnu-panic-screen.c with
        # -I$UNIXNU_UEFI/Silicon/Silicium/SiliciumPkg/Library/FrameBufferSerialPortLib for Font.h.
        # The README notes the same requirement for the payload step.
        uses: actions/checkout@v4
        with:
          repository: yyx2025/uefi-vermeer
          ref: vermeer
          path: uefi
          sparse-checkout: |
            Silicon/Silicium/SiliciumPkg/Library/FrameBufferSerialPortLib

      - name: Install build dependencies
        run: |
          brew install git make cmake ninja unifdef llvm lld mtools qemu dtc

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          python3 --version
          qemu-system-aarch64 --version | head -1
          ls "$(dirname "$(command -v qemu-system-aarch64)")/../share/qemu/edk2-aarch64-code.fd"

      - name: Cache IPSW components
        uses: actions/cache@v4
        with:
          path: out/ipsw
          key: ipsw-qemu-${{ hashFiles('board.toml') }}

      - name: Configure (defconfig qemu)
        run: |
          python3 unixnu/unixnu defconfig qemu_defconfig -D "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/out"

      - name: Fetch the Apple reference sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 unixnu/unixnu fetch xnu libplatform libdispatch AvailabilityVersions libpthread \
                          corecrypto-2023 IOStorageFamily \
                          -D "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/out"

      - name: Build package and kernel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 unixnu/unixnu build package kernel \
            -D "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/out"

      - name: Build payload (TCG timebase, empty platform seed until one is recorded)
        # --uefi is required here, not just the UNIXNU_UEFI environment variable: unixnu's payload step passes
        # UNIXNU_UEFI=str(ctx.uefi or '') to the probe patcher, and ctx.uefi is only set from --uefi. An empty
        # value makes patch-xnu-entry-probe.py fall back to its <tree>/uefi-sheng default, which is not in the
        # workspace, so the panic screen cannot find Font.h.
        run: |
          python3 unixnu/unixnu build payload \
            -D "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/out" \
            --uefi "$GITHUB_WORKSPACE/uefi" \
            --unique-chip-id 0000000000000001

      - name: Upload kernel and payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-kernel-payload
          path: |
            out/qemu/kernel/**
            out/qemu/payload/**
            out/qemu/logs/**
          if-no-files-found: warn

      - name: Boot the native-user fixture in QEMU
        run: |
          set -o pipefail
          python3 out/qemu/tree/scripts/run-qemu.py \
            --native-user --accel tcg --seconds "${{ inputs.seconds || 420 }}" 2>&1 | tee run-qemu.log

      - name: Check the run reached EL0
        run: |
          python3 out/qemu/tree/scripts/check-qemu-run.py \
            --work out/qemu --stdout run-qemu.log \
            --expect-native-user --expect-screen --reject-panic

      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-run
          path: out/qemu/run/
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-logs
          path: |
            out/qemu/logs/
            out/qemu/run/
          if-no-files-found: warn

  # Stage 2: the original iPadOS userland.
  #
  # qemu_root_defconfig adds the verified VirtIO block driver, the owner root chain,
  # the SystemOS union mount, the Data mount and the frame buffer display. The OS and
  # SystemOS volumes come from the board's iPad7,1 iPadOS 17.7.11 IPSW (6.4 GiB), and
  # scripts/build-os-root.py signs and verifies them, records the block storage ABI by
  # booting the stage-1 kernel once in QEMU, and builds the Data seed.
  #
  # Success is /sbin/launchd from the OS volume running and SpringBoard reaching its
  # main loop: qemu-ps.py reports the process list. The welcome screen is the visible
  # proof in the screenshots.
  os-root:
    runs-on: macos-15
    timeout-minutes: 300
    needs: native-user

    steps:
      - name: Checkout device repository (UniXNU-qemu)
        uses: actions/checkout@v4

      - name: Checkout UniXNU build system (with submodules)
        uses: actions/checkout@v4
        with:
          # Fork, not upstream: vermeer-fix carries -Wno-unknown-warning-option in
          # scripts/audit-storage-interface.py and the legacy-display guard in
          # patches/xnu/offline-component-load-probes.patch.
          repository: yyx2025/UniXNU
          ref: vermeer-fix
          submodules: recursive
          path: unixnu

      - name: Checkout Mu-Silicium for the panic screen font
        uses: actions/checkout@v4
        with:
          repository: yyx2025/uefi-vermeer
          ref: vermeer
          path: uefi
          sparse-checkout: |
            Silicon/Silicium/SiliciumPkg/Library/FrameBufferSerialPortLib

      - name: Install build dependencies
        # openssl@3 is what kits/VerifiedRoot/tests/check.py signs with; hdiutil,
        # diskutil and dtc come with macOS or the earlier steps.
        run: |
          brew install git make cmake ninja unifdef llvm lld mtools qemu dtc openssl@3

      - name: Cache the IPSW and its extracted volumes
        uses: actions/cache@v4
        with:
          path: |
            out/ipsw
            .cache/firmware
          key: ipsw-volumes-qemu-${{ hashFiles('board.toml') }}-v1

      - name: Download the board IPSW
        # extract-target-volume.py opens the zip directly, so it needs the whole file
        # rather than the range-read members the kernel step uses.
        run: |
          mkdir -p ipsw
          ipsw=ipsw/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw
          if [ ! -s "$ipsw" ]; then
            curl -fL --retry 3 --retry-delay 5 \
              "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw" \
              -o "$ipsw"
          fi
          ls -l "$ipsw"

      - name: Configure (defconfig qemu)
        run: |
          python3 unixnu/unixnu defconfig qemu_defconfig -D "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/out"

      - name: Fetch the Apple reference sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 unixnu/unixnu fetch xnu libplatform libdispatch AvailabilityVersions libpthread \
                          corecrypto-2023 IOStorageFamily \
                          -D "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/out"

      - name: Build package and kernel (qemu_defconfig, for the storage ABI)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 unixnu/unixnu build package kernel \
            -D "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/out"

      - name: Build payload (qemu_defconfig, TCG)
        run: |
          python3 unixnu/unixnu build payload \
            -D "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/out" \
            --uefi "$GITHUB_WORKSPACE/uefi" \
            --unique-chip-id 0000000000000001

      - name: Extract the OS trust cache member
        # build-original-system-trust.py reads the OS volume's companion trust cache from
        # out/ipsw/<build>/. That file is a zip member (Firmware/<dmg>.trustcache) and not a
        # manifest component, so "unixnu ipsw fetch" never extracts it.
        run: |
          python3 scripts/extract-ipsw-member.py \
            "$GITHUB_WORKSPACE/ipsw/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw" \
            044-76040-038.dmg.trustcache "$GITHUB_WORKSPACE/out/ipsw/21H461"

      - name: Build the OS root inputs
        env:
          UNIXNU_UEFI: ${{ github.workspace }}/uefi
        run: |
          cd out/qemu/tree
          python3 scripts/build-os-root.py \
            --ipsw "$GITHUB_WORKSPACE/ipsw/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw" \
            --openssl-prefix "$(brew --prefix openssl@3)"

      - name: Configure (defconfig qemu_root)
        run: |
          volume=$(python3 -c "import json;print(json.load(open('out/qemu/tree/.cache/firmware/owner-data/seed.json'))['volume_uuid'])")
          printf 'XNU_OWNER_DATA_VOLUME_UUID=%s\n' "$volume" >> "$GITHUB_ENV"
          python3 unixnu/unixnu defconfig qemu_root_defconfig -D "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/out"

      - name: Build kernel (qemu_root_defconfig)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python3 unixnu/unixnu build kernel -D "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/out" 2>&1 | tee root-kernel.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '### qemu_root_defconfig kernel build failed'
              echo ''
              echo '```'
              tail -n 80 root-kernel.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Annotations are the one channel GitHub exposes without an artifacts download.
            grep -E 'error:|Undefined symbols|ld: |failed' root-kernel.log | tail -n 25 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit "$status"
          fi

      - name: Build payload (qemu_root_defconfig, TCG)
        run: |
          python3 unixnu/unixnu build payload \
            -D "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/out" \
            --uefi "$GITHUB_WORKSPACE/uefi" \
            --unique-chip-id 0000000000000001 \
            --trust-cache out/qemu/tree/build/original-static-system-trust/original-static-system.bundle \
            --data-ramdisk .cache/firmware/owner-data/owner-data-1g.dbr

      - name: Boot the iPadOS userland in QEMU
        # TCG needs about five minutes to SpringBoard, so the run is long.
        run: |
          set -o pipefail
          python3 out/qemu/tree/scripts/run-qemu.py --os-root --accel tcg --seconds 2400 \
            2>&1 | tee run-qemu-os.log

      - name: Check the userland started
        run: |
          python3 out/qemu/tree/scripts/check-qemu-run.py \
            --work out/qemu --stdout run-qemu-os.log \
            --expect-screen --reject-panic

      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-os-run
          path: out/qemu/run/
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-os-logs
          path: out/qemu/logs/
          if-no-files-found: warn
